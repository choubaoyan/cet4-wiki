<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>词林 · 四六级词汇百科</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238b5a2b'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Georgia' fill='%23fbf9f5' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
<style>
  /* ---- Design Tokens（瑞士风 · 归藏设计系统）---- */
  :root {
    --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
    --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

    --paper: #fafaf8;
    --block: #f0efea;
    --ink: #0a0a0a;
    --ink-2: #3f3f3f;
    --muted: #6f6f6f;
    --line: #e5e3dd;
    --line-strong: #c9c6bd;
    --accent: #d0021b;

    --rail: 208px;
    --col: 36em;

    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  [data-theme="dark"] {
    --paper: #121211;
    --block: #1d1c1a;
    --ink: #f2f0ea;
    --ink-2: #c4c1b8;
    --muted: #8d8a82;
    --line: #2a2825;
    --line-strong: #3d3a35;
  }

  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.8 var(--font-sans);
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--ink); color: var(--paper); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  input { font: inherit; }
  code { font-family: var(--font-mono); font-size: .9em; background: var(--block); padding: 1px 5px; }
  h1, h2, h3 { margin: 0; font-weight: 400; letter-spacing: -0.02em; }

  .ico { width: 16px; height: 16px; flex: 0 0 auto; stroke: currentColor; fill: none;
         stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
  .ico-sm { width: 13px; height: 13px; }

  /* 元信息统一：等宽小号大写 */
  .meta, .side-title, .section-h h2, .section-h span, .crumb, .intro-top, .intro-bottom {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  /* ---- 布局：左轨 + 正文栏 ---- */
  .shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

  .sidebar {
    border-right: 1px solid var(--line);
    padding: var(--s6) var(--s5) var(--s6) var(--s5);
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; gap: var(--s6);
    overflow-y: auto;
  }
  .brand { display: flex; align-items: baseline; gap: var(--s2); }
  .brand b { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .brand span { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  .level-switch { display: flex; gap: var(--s4); border-bottom: 1px solid var(--line); padding-bottom: 1px; }
  .level-switch button {
    padding: 4px 0; font-size: 13px; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    font-family: var(--font-mono); letter-spacing: .06em;
  }
  .level-switch button:hover { color: var(--ink); }
  .level-switch button.on { color: var(--ink); border-bottom-color: var(--ink); }

  .nav { display: grid; gap: 1px; }
  .nav a {
    display: flex; align-items: center; gap: var(--s3);
    padding: 7px 0 7px 10px;
    border-left: 2px solid transparent;
    color: var(--ink-2); font-size: 15px;
  }
  .nav a:hover { color: var(--ink); }
  .nav a.on { color: var(--ink); border-left-color: var(--ink); font-weight: 500; }
  .nav a em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  .side-title { color: var(--muted); padding-left: 12px; margin-bottom: calc(var(--s3) * -1 + 2px); }
  .letters { display: grid; grid-template-columns: repeat(3, 1fr); }
  .letters a {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 5px 12px 5px 10px; border-left: 2px solid transparent;
    font-size: 13px; color: var(--ink-2); font-family: var(--font-mono);
  }
  .letters a:hover { background: var(--block); color: var(--ink); }
  .letters a em { font-style: normal; font-size: 10px; color: var(--muted); }
  .letters a.dim { color: #cfcdc5; pointer-events: none; }

  .theme-toggle {
    display: flex; align-items: center; gap: var(--s2);
    width: 100%; padding: 7px 10px;
    border-left: 2px solid transparent;
    color: var(--ink-2); font-size: 13px;
  }
  .theme-toggle:hover { background: var(--block); color: var(--ink); }

  .progress { margin-top: auto; padding-top: var(--s4); border-top: 1px solid var(--line); }
  .progress .row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted);
                   font-family: var(--font-mono); letter-spacing: .06em; padding-left: 10px; }
  .bar { height: 2px; background: var(--line); margin: var(--s2) 0 0 10px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s ease; }

  main { padding: var(--s8) var(--s8) var(--s8); max-width: calc(var(--col) + var(--s8) * 2); width: 100%; }

  /* ---- 搜索：下划线式 ---- */
  .search-wrap { position: relative; margin-bottom: var(--s7); }
  .search {
    width: 100%; padding: 8px 44px 8px 26px;
    border: 0; border-bottom: 1px solid var(--line-strong);
    background: transparent; border-radius: 0;
    outline: none; color: var(--ink); font-size: 16px;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { border-bottom-color: var(--ink); }
  .search-ico { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search-wrap kbd {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    border: 1px solid var(--line); padding: 0 4px; line-height: 16px;
  }
  .results {
    position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px);
    background: var(--paper); border: 1px solid var(--line);
    display: none;
  }
  .results.open { display: block; }
  .results .item { display: flex; gap: var(--s3); align-items: baseline; padding: 8px var(--s3); }
  .results .item:hover, .results .item.sel { background: var(--block); }
  .results .w { font-family: var(--font-mono); font-size: 14px; min-width: 130px; }
  .results .d { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .empty { padding: var(--s3); color: var(--muted); font-size: 13px; }

  /* ---- 首页 ---- */
  .hero { padding-bottom: var(--s5); border-bottom: 2px solid var(--ink); margin-bottom: var(--s6); }
  .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em;
            text-transform: uppercase; color: var(--muted); margin-bottom: var(--s3); }
  .hero h1 { font-size: 34px; font-weight: 300; line-height: 1.25; margin-bottom: var(--s3); }
  .hero p { margin: 0; color: var(--ink-2); max-width: var(--col); font-size: 16px; }
  .hero .stats { display: flex; margin-top: var(--s5); }
  .hero .stats div { font-size: 11px; color: var(--muted); font-family: var(--font-mono);
                     letter-spacing: .12em; text-transform: uppercase;
                     padding: 0 var(--s5); border-left: 1px solid var(--line); }
  .hero .stats div:first-child { padding-left: 0; border-left: 0; }
  .hero .stats b { display: block; font-size: 26px; color: var(--ink); font-weight: 300;
                   font-family: var(--font-mono); letter-spacing: -0.02em; margin-bottom: 2px; }

  .section-h { display: flex; align-items: baseline; justify-content: space-between;
    margin: var(--s7) 0 var(--s4); }
  .section-h h2 { color: var(--ink); }
  .section-h span { color: var(--muted); }

  .alpha { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0;
           border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .alpha a {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 10px var(--s3); background: var(--paper);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 13px;
  }
  .alpha a:hover { background: var(--ink); color: var(--paper); }
  .alpha a:hover em { color: var(--paper); opacity: .7; }
  .alpha a em { font-style: normal; font-size: 10px; color: var(--muted); }

  .hist { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .hist a, .hist button {
    padding: 3px 10px; background: var(--block);
    font-size: 13px; color: var(--ink-2); font-family: var(--font-mono);
  }
  .hist a:hover, .hist button:hover { color: var(--ink); background: var(--line); }

  /* ---- 词条 ---- */
  .crumb { color: var(--muted); margin-bottom: var(--s5); }
  .crumb a:hover { color: var(--ink); }

  .entry h1 { font-size: 52px; font-weight: 300; line-height: 1.1; letter-spacing: -0.03em; }
  .entry-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s4); }
  .entry-letter { font-family: var(--font-mono); font-size: 88px; line-height: 1;
                  color: var(--block); font-weight: 500; user-select: none; }
  .phon { display: flex; gap: var(--s4); flex-wrap: wrap; margin: var(--s3) 0 0; }
  .phon button {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 0; border-bottom: 1px solid var(--line-strong);
    font-size: 14px; color: var(--ink-2); font-family: var(--font-mono);
  }
  .phon button:hover { border-bottom-color: var(--ink); color: var(--ink); }
  .phon .tag { color: var(--muted); font-size: 11px; font-family: var(--font-mono); margin-right: var(--s1); }

  .entry-grid { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: var(--s7); margin-top: var(--s6); }
  @media (max-width: 860px) { .entry-grid { grid-template-columns: 1fr; } }

  .defs { margin: 0; padding: 0; list-style: none; }
  .defs li {
    display: grid; grid-template-columns: 32px 1fr; gap: var(--s2);
    padding: var(--s3) 0;
    font-size: 17px; line-height: 1.75;
  }
  .defs li i { font-style: normal; font-family: var(--font-mono); font-size: 11px;
               color: var(--muted); padding-top: 6px; letter-spacing: .06em; }

  .example { margin-top: var(--s3); padding-left: var(--s4); border-left: 2px solid var(--ink); }
  .example .en { margin: 0 0 var(--s2); font-size: 16px; display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .example .zh { margin: 0; color: var(--muted); font-size: 14px; }
  .mini {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 8px; background: var(--block);
    font-size: 11px; color: var(--ink-2); font-family: var(--font-mono); letter-spacing: .06em;
  }
  .mini:hover { background: var(--line); color: var(--ink); }
  .muted { color: var(--muted); font-size: 14px; margin: var(--s2) 0 0; }

  .aside-card { background: var(--block); padding: var(--s5); }
  .aside-card h3 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
                   text-transform: uppercase; color: var(--muted); margin-bottom: var(--s4); }
  .aside-card dl { margin: 0 0 var(--s4); display: grid; grid-template-columns: auto 1fr; gap: var(--s2); font-size: 13px; }
  .aside-card dt { color: var(--muted); }
  .aside-card dd { margin: 0; text-align: right; font-family: var(--font-mono); }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: var(--s2);
    width: 100%; padding: 10px var(--s3);
    border: 1px solid var(--ink);
    font-size: 14px; color: var(--ink); background: transparent;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn + .btn { margin-top: var(--s2); }
  .btn.on { background: var(--ink); color: var(--paper); }

  .pager { display: flex; align-items: center; justify-content: space-between;
    margin-top: var(--s7); padding-top: var(--s3); border-top: 1px solid var(--line); }
  .pager a { display: inline-flex; align-items: center; gap: var(--s2); font-size: 14px; color: var(--ink-2); }
  .pager a:hover { color: var(--ink); }
  .pager span { color: var(--muted); font-size: 11px; font-family: var(--font-mono); letter-spacing: .08em; }

  .rel { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
  .rel a { padding: 2px 8px; background: var(--block); font-size: 13px; font-family: var(--font-mono); }
  .rel a:hover { background: var(--line); }

  /* ---- 列表 ---- */
  .wordlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0 var(--s6); margin-top: var(--s2); }
  .wordlist a { display: flex; align-items: baseline; gap: var(--s3); padding: 10px 0; }
  .wordlist a:hover span { background: var(--ink); color: var(--paper); }
  .wordlist a span { font-family: var(--font-mono); font-size: 14px; padding: 0 2px; }
  .wordlist a em { font-style: normal; color: var(--muted); font-size: 12px; flex: 1; min-width: 0;
                   text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit { background: var(--ink); color: var(--paper); }
  .empty-box { background: var(--block); padding: var(--s7); text-align: center; color: var(--muted); font-size: 15px; }

  /* ---- 真题 ---- */
  .exam-head { border-top: 3px solid var(--ink); padding-top: var(--s3); margin-bottom: var(--s5); }
  .exam-band { display: flex; justify-content: space-between; align-items: center;
               background: var(--accent); color: #fff; padding: 4px var(--s3);
               font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
               margin-bottom: var(--s4); }
  .exam-head h1 { font-size: 30px; font-weight: 300; }
  .exam-total { color: var(--muted); font-size: 15px; margin-left: var(--s2); font-family: var(--font-mono); }
  .exam-q { font-size: 19px; line-height: 1.8; margin: 0 0 var(--s5); max-width: 34em; }
  .exam-opts { display: grid; gap: var(--s2); max-width: 40em; }
  .exam-opt { display: grid; grid-template-columns: 28px 1fr; gap: var(--s3); align-items: baseline;
              text-align: left; padding: var(--s3) var(--s4); background: var(--block); font-size: 16px; }
  .exam-opt i { font-style: normal; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .exam-opt:hover { background: var(--line); }
  .exam-opt.right { background: var(--ink); color: var(--paper); }
  .exam-opt.right i { color: var(--paper); opacity: .6; }
  .exam-opt.wrong { background: transparent; box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
  .exam-tip { margin-top: var(--s5); padding-left: var(--s4); border-left: 3px solid var(--accent); }
  .exam-tip b { font-size: 13px; letter-spacing: .1em; color: var(--accent); }
  .exam-tip p { margin: var(--s2) 0 var(--s4); color: var(--ink-2); font-size: 15px; }
  .exam-done { background: var(--block); padding: var(--s7); }
  .exam-done h1 { font-size: 26px; font-weight: 300; margin-bottom: var(--s3); }
  .wrong-q { display: grid; gap: var(--s3); }
  .wrong-q div { background: var(--block); padding: var(--s4); }
  .wrong-q b { font-weight: 500; font-size: 15px; }
  .wrong-q p { margin: var(--s2) 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

  /* ---- 首页功能简介 ---- */
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px;
              background: var(--line); border: 1px solid var(--line); margin-top: var(--s2); }
  .features article { background: var(--paper); padding: var(--s4); }
  .features h3 { font-size: 14px; font-weight: 500; margin-bottom: var(--s2); display: flex; align-items: center; gap: var(--s2); }
  .features p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .features .ico { color: var(--accent); }

  /* ---- 学习 ---- */
  .mode-switch { display: flex; gap: var(--s4); margin-bottom: var(--s4); }
  .mode-switch button {
    padding: 3px 0; font-size: 13px; color: var(--muted);
    border-bottom: 2px solid transparent; font-family: var(--font-mono);
  }
  .mode-switch button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .mode-switch button:hover { color: var(--ink); }

  .study-meta { display: flex; gap: var(--s6); color: var(--muted); font-size: 11px;
                font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: var(--s5); }
  .card-area { display: grid; place-items: center; padding: var(--s6) 0; }
  .flashcard {
    width: min(540px, 100%); min-height: 280px;
    background: var(--block);
    display: grid; place-items: center; text-align: center; padding: var(--s7);
    cursor: pointer; position: relative;
  }
  .flashcard .front { font-size: 44px; font-family: var(--font-mono); font-weight: 300; letter-spacing: -0.02em; }
  .flashcard .back { font-size: 19px; line-height: 1.9; }
  .flashcard .hint { position: absolute; bottom: var(--s4); font-size: 11px; color: var(--muted);
                     font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; }
  .study-actions { display: flex; gap: var(--s2); justify-content: center; margin-top: var(--s6); }
  .study-actions .btn { width: auto; padding: 10px var(--s6); }
  .quiz-option {
    display: block; width: 100%; text-align: left; padding: var(--s3) var(--s4); margin-bottom: var(--s2);
    background: var(--block); font-size: 16px;
  }
  .quiz-option:hover { background: var(--line); }
  .quiz-option.right { background: var(--ink); color: var(--paper); }
  .quiz-option.wrong { background: transparent; color: var(--muted); text-decoration: line-through; }

  /* ---- 生词本工具条 / 设置项 ---- */
  .book-bar { display: flex; flex-wrap: wrap; gap: var(--s2); margin: var(--s5) 0 var(--s6); }
  .book-bar .btn { width: auto; padding: 8px var(--s4); font-size: 13px; }
  .check { display: flex; align-items: center; gap: var(--s2); font-size: 15px; color: var(--ink-2); margin-top: var(--s4); }
  .check input { width: 14px; height: 14px; accent-color: var(--ink); }
  .letters-toggle { display: none; }

  /* ---- 动效（克制）---- */
  #app { animation: pagein .18s ease-out; }
  @keyframes pagein { from { opacity: 0; } to { opacity: 1; } }
  .alpha a, .results .item, .wordlist a span, .quiz-option, .hist a, .btn, .letters a, .nav a, .mini, .phon button, .theme-toggle {
    transition: background-color .14s ease, color .14s ease, border-color .14s ease;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  footer.site { margin-top: var(--s8); padding-top: var(--s4); border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12px; line-height: 1.9; font-family: var(--font-mono); letter-spacing: .02em; }


  /* ---- 开屏片头（2.1s） ---- */
  .intro {
    position: fixed; inset: 0; z-index: 200;
    display: grid; place-items: center;
    background: var(--paper);
    transition: opacity .45s ease;
  }
  .intro.out { opacity: 0; pointer-events: none; }
  .intro-inner { text-align: center; padding: 0 var(--s5); }
  .intro-logo {
    width: 176px; height: auto; color: var(--ink); display: block; margin: 0 auto;
    opacity: 0; transform: translateY(8px);
    animation: introLogo .62s cubic-bezier(.2,.7,.2,1) .06s forwards;
  }
  .intro-cn {
    margin-top: var(--s4); font-size: 12px; letter-spacing: .52em; text-indent: .52em;
    color: var(--muted); opacity: 0;
    animation: introUp .5s ease .42s forwards;
  }
  .intro-line {
    width: 0; height: 1px; background: var(--line-strong); margin: var(--s4) auto 0;
    animation: introLine .7s cubic-bezier(.3,.8,.2,1) .58s forwards;
  }
  .intro-slogan {
    margin: var(--s4) 0 0; font-size: 14px; color: var(--ink-2); opacity: 0;
    animation: introUp .5s ease .82s forwards;
  }
  .intro-skip {
    position: fixed; right: var(--s5); bottom: var(--s5);
    padding: 5px var(--s3); font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: var(--r1); background: transparent;
  }
  .intro-skip:hover { color: var(--ink); border-color: var(--ink); }
  @keyframes introLogo { to { opacity: 1; transform: none; } }

<script>
(() => {
  'use strict';

  const norm = (arr, lv) => (arr || []).map(w => ({
    n: w.n,
    t: Array.isArray(w.t) ? w.t : [String(w.t || '')],
    u: w.u || '',
    k: w.k || '',
    lower: w.n.toLowerCase(),
    lv,
  }));

  const POOLS = {
    cet4: norm(window.CET4_WORDS, 'cet4'),
    cet6: norm(window.CET6_WORDS, 'cet6'),
  };
  {
    // 全部：以四级优先去重合并
    const seen = new Set(POOLS.cet4.map(w => w.lower));
    POOLS.all = POOLS.cet4.concat(POOLS.cet6.filter(w => !seen.has(w.lower)));
  }
  const LEVEL_LABEL = { cet4: '四级', cet6: '六级', all: '四级 + 六级' };

  let level = 'cet4';
  try { level = JSON.parse(localStorage.getItem('cet4.level') || '"cet4"'); } catch {}
  if (!POOLS[level]) level = 'cet4';

  let WORDS = POOLS[level];
  let INDEX, byLetter;
  function indexPool() {
    WORDS = POOLS[level];
    INDEX = new Map(WORDS.map((w, i) => [w.lower, i]));
    byLetter = new Map();
    for (const w of WORDS) {
      const L = w.n[0].toUpperCase();
      if (!byLetter.has(L)) byLetter.set(L, []);
      byLetter.get(L).push(w);
    }
  }
  indexPool();

  const EXAMPLES = window.CET4_EXAMPLES || {};

  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let book = new Set(LS.get('cet4.book', []));
  let known = new Set(LS.get('cet4.known', []));
  let recent = LS.get('cet4.recent', []);
  let wrongBook = LS.get('cet4.wrong', {});   // { word: 错误次数 }
  const wrongCount = () => Object.keys(wrongBook).length;

  const app = document.getElementById('app');
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- 朗读 ---------- */
  function speakWord(text, lang = 'en-US') {
    if (!text || typeof speechSynthesis === 'undefined') return;
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = lang;
    u.rate = 0.95;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  /* ---------- 主题 ---------- */
  const THEME_KEY = 'cet4.theme';
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    LS.set(THEME_KEY, theme);
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (icon) icon.setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
    if (label) label.textContent = theme === 'dark' ? '浅色模式' : '深色模式';
  }
  function setLevel(next) {
    if (!POOLS[next]) return;
    level = next;
    try { localStorage.setItem('cet4.level', JSON.stringify(level)); } catch {}
    indexPool();
    document.querySelectorAll('[data-level]').forEach(b => {
      b.classList.toggle('on', b.dataset.level === level);
    });
    const bl = document.getElementById('brand-level');
    if (bl) bl.textContent = level === 'cet4' ? 'CET-4' : level === 'cet6' ? 'CET-6' : 'CET-4+6';
    const fb = document.querySelector('footer.site .level-note');
    if (fb) fb.textContent = LEVEL_LABEL[level] + ' 词库 · ' + WORDS.length + ' 条';
    renderSidebar();
    route();
  }
  document.querySelectorAll('[data-level]').forEach(b => {
    b.classList.toggle('on', b.dataset.level === level);
    b.addEventListener('click', () => setLevel(b.dataset.level));
  });

  const lettersBtn = document.getElementById('letters-toggle');
  if (lettersBtn) {
    lettersBtn.addEventListener('click', () => {
      const letters = document.getElementById('letters');
      const open = letters.classList.toggle('open');
      lettersBtn.setAttribute('aria-expanded', String(open));
      lettersBtn.textContent = open ? '收起索引' : '按字母索引';
    });
  }

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });
  applyTheme(LS.get(THEME_KEY, window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  /* ---------- 侧栏 ---------- */
  function renderSidebar() {
    const letters = document.getElementById('letters');
    letters.innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L => {
      const n = byLetter.get(L)?.length || 0;
      return n
        ? `<a href="#/l/${L}">${L}<em>${n}</em></a>`
        : `<a class="dim">${L}</a>`;
    }).join('');

    const pct = WORDS.length ? (known.size / WORDS.length) * 100 : 0;
    $('#known-count').textContent = `${known.size} / ${WORDS.length}`;
    $('#known-bar').style.width = pct.toFixed(1) + '%';
    $('#book-count').textContent = String(book.size);
    $('#book-count-2').textContent = String(book.size);
    const ec = document.getElementById('exam-count');
    if (ec) ec.textContent = String((window.CET_QUIZ || []).filter(q => level === 'all' || q.lv === level).length);
    const wc = document.getElementById('wrong-count');
    if (wc) wc.textContent = String(Object.keys(wrongBook).length);
  }

  function setActiveNav(route) {
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.route === route));
  }

  /* ---------- 搜索 ---------- */
  const qInput = $('#q');
  const resultsBox = $('#results');
  let sel = -1;
  let current = [];

  function search(q) {
    const s = q.trim().toLowerCase();
    if (!s) return [];
    const exact = [], prefix = [], sub = [], cn = [];
    for (const w of WORDS) {
      if (w.lower === s) exact.push(w);
      else if (w.lower.startsWith(s)) prefix.push(w);
      else if (w.lower.includes(s)) sub.push(w);
      else if (w.t.some(t => t.includes(s))) cn.push(w);
      if (exact.length + prefix.length + sub.length + cn.length > 400) break;
    }
    return [...exact, ...prefix, ...sub, ...cn].slice(0, 12);
  }

  function renderResults(list) {
    current = list;
    sel = -1;
    if (!list.length) {
      resultsBox.innerHTML = '<div class="empty">没有匹配的词，试试换一个拼写或中文关键词</div>';
      resultsBox.classList.add('open');
      return;
    }
    resultsBox.innerHTML = list.map((w, i) => `
      <a class="item" href="#/w/${encodeURIComponent(w.n)}" data-i="${i}">
        <span class="w">${esc(w.n)}</span>
        <span class="d">${esc(w.t.join('；'))}</span>
      </a>`).join('')
      + `<a class="item" style="justify-content:center;color:var(--accent)" href="#/search/${encodeURIComponent(qInput.value.trim())}">查看全部「${esc(qInput.value.trim())}」的结果</a>`;
    resultsBox.classList.add('open');
  }

  qInput.addEventListener('input', () => renderResults(search(qInput.value)));
  qInput.addEventListener('focus', () => { if (qInput.value.trim()) renderResults(search(qInput.value)); });
  qInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { resultsBox.classList.remove('open'); qInput.blur(); return; }
    if (!current.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + current.length) % current.length;
      [...resultsBox.querySelectorAll('.item')].forEach((el, i) => el.classList.toggle('sel', i === sel));
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const w = current[sel < 0 ? 0 : sel];
      if (w) { pushHistory(qInput.value.trim()); qInput.value = ''; resultsBox.classList.remove('open'); location.hash = '#/w/' + encodeURIComponent(w.n); }
    }
  });
  document.addEventListener('click', (e) => {
    if (!resultsBox.contains(e.target) && e.target !== qInput) resultsBox.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== qInput) { e.preventDefault(); qInput.focus(); }
  });

  /* ---------- 页面 ---------- */
  function pushHistory(q) {
    if (!q) return;
    let h = LS.get('cet4.history', []);
    h = [q, ...h.filter(x => x !== q)].slice(0, 8);
    LS.set('cet4.history', h);
  }

  function highlight(text, q) {
    const t = esc(text);
    if (!q) return t;
    const safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return t.replace(new RegExp('(' + safe + ')', 'gi'), '<span class="hit">$1</span>');
  }

  function pageSearch(q) {
    const s = String(q || '').trim();
    const hits = search(s);
    const all = [];
    if (s) {
      const low = s.toLowerCase();
      for (const w of WORDS) {
        if (w.lower.includes(low) || w.t.some(t => t.includes(s))) all.push(w);
      }
    }
    return `
      <div class="crumb"><a href="#/">词库</a> / 搜索</div>
      <h1 style="margin:0 0 6px;font-size:28px">「${esc(s)}」</h1>
      <p class="muted" style="margin:0 0 20px">命中 ${all.length} 个词条${hits.length ? '，前 ' + hits.length + ' 个已按相关度排序' : ''}</p>
      ${all.length
        ? `<div class="wordlist">${all.slice(0, 120).map(w => `<a href="#/w/${encodeURIComponent(w.n)}"><span>${highlight(w.n, s)}</span><em>${esc(w.t.join('；'))}</em></a>`).join('')}</div>`
        : '<div class="empty-box">没有命中。试试更短的拼写，或者换个中文关键词。</div>'}
    `;
  }

  function pageHome() {
    const today = WORDS[Math.floor((Date.now() / 86400000)) % WORDS.length];
    const rec = recent.slice(0, 6).map(n => INDEX.get(n.toLowerCase())).filter(i => i !== undefined).map(i => WORDS[i]);
    return `
      <section class="hero">
        <div class="kicker">Word Atlas / 词库</div>
      <h1>${LEVEL_LABEL[level]}词汇百科</h1>
        <p>把 CET-4 的 ${WORDS.length} 个核心词做成可查阅、可标记、可复习的词典。左边按字母翻，顶上直接搜；遇到不熟的词点「加入生词本」，学完点「已掌握」。</p>
        <div class="stats">
          <div><b>${WORDS.length}</b>收录词条</div>
          <div><b>${byLetter.size}</b>首字母分组</div>
          <div><b>${known.size}</b>已掌握</div>
          <div><b>${book.size}</b>生词本</div>
        </div>
      </section>

      ${(LS.get('cet4.history', []).length) ? `
      <div class="section-h"><h2>最近搜索</h2><span>点一下再来一次</span></div>
      <div class="hist">${LS.get('cet4.history', []).map(q => `<a href="#/search/${encodeURIComponent(q)}">${esc(q)}</a>`).join('')}</div>` : ''}

      <div class="section-h"><h2>这里能做什么</h2><span>四项功能</span></div>
      <div class="features">
        <article><h3><svg class="ico"><use href="#i-book"/></svg>词库</h3><p>四级 2607 词、六级 2345 词，含音标与释义，按字母或搜索直达。</p></article>
        <article><h3><svg class="ico"><use href="#i-paper"/></svg>真题练习</h3><p>词汇、语法、阅读三类题，答完即时给解析，答错自动进错题本。</p></article>
        <article><h3><svg class="ico"><use href="#i-flag"/></svg>错题本</h3><p>错词按错误次数排序，错题按题号归档，都能一键重练。</p></article>
        <article><h3><svg class="ico"><use href="#i-cards"/></svg>学习模式</h3><p>闪卡与看词选义两种模式，学完自动记为已掌握。</p></article>
      </div>

      <div class="section-h"><h2>今日一词</h2><span>每天换一个</span></div>
      <a class="rel" style="text-decoration:none" href="#/w/${encodeURIComponent(today.n)}">
        <span style="font-size:22px;font-family:ui-monospace,monospace">${esc(today.n)}</span>
        <span style="color:var(--muted)">${esc(today.t.join('；'))}</span>
      </a>

      <div class="section-h"><h2>按字母浏览</h2><span>共 ${byLetter.size} 组</span></div>
      <div class="alpha">
        ${[...byLetter.keys()].sort().map(L => `<a href="#/l/${L}">${L}<em>${byLetter.get(L).length}</em></a>`).join('')}
      </div>

      ${rec.length ? `
      <div class="section-h"><h2>最近看过</h2><span>${rec.length} 条</span></div>
      <div class="rel">${rec.map(w => `<a href="#/w/${encodeURIComponent(w.n)}">${esc(w.n)}</a>`).join('')}</div>` : ''}
    `;
  }

  function pageLetter(L) {
    const list = byLetter.get(L) || [];
    return `
      <div class="crumb"><a href="#/">词库</a> / ${L}</div>
      <h1 style="margin:0 0 6px;font-size:30px">${L}</h1>
      <p style="color:var(--muted);margin:0">${list.length} 个词条</p>
      <div class="wordlist">
        ${list.map(w => `<a href="#/w/${encodeURIComponent(w.n)}"><span>${esc(w.n)}</span><em>${esc(w.t[0] || '')}</em></a>`).join('')}
      </div>
    `;
  }

  function similarWords(w) {
    const base = w.lower;
    const head = base.slice(0, 3);
    const cands = [];
    for (const other of WORDS) {
      if (other.lower === base) continue;
      if (other.lower.startsWith(head)) { cands.push([other, 0]); continue; }
      if (Math.abs(other.lower.length - base.length) <= 1 && other.lower[0] === base[0] && editDistance(other.lower, base) <= 2) cands.push([other, 1]);
      if (cands.length > 60) break;
    }
    return cands.sort((a, b) => a[1] - b[1] || a[0].lower.length - b[0].lower.length).slice(0, 8).map(x => x[0]);
  }

  function editDistance(a, b) {
    const m = a.length, n = b.length;
    if (Math.abs(m - n) > 2) return 9;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  function pageWord(name) {
    const idx = INDEX.get(String(name).toLowerCase());
    if (idx === undefined) {
      return `<div class="empty-box">词库里没有「${esc(name)}」。<br><a href="#/">回到首页</a> 再搜一次？</div>`;
    }
    const w = WORDS[idx];
    const inBook = book.has(w.lower);
    const isKnown = known.has(w.lower);
    const rel = similarWords(w);
    const prev = WORDS[idx - 1], next = WORDS[idx + 1];

    recent = [w.n, ...recent.filter(x => x.toLowerCase() !== w.lower)].slice(0, 12);
    LS.set('cet4.recent', recent);

    return `
      <div class="crumb"><a href="#/">词库</a> / <a href="#/l/${w.n[0].toUpperCase()}">${w.n[0].toUpperCase()}</a> / ${esc(w.n)}</div>
      <article class="entry">
        <div class="entry-head">
          <h1>${esc(w.n)}</h1>
          <span class="entry-letter" aria-hidden="true">${esc(w.n[0].toUpperCase())}</span>
        </div>
        <div class="phon">
          ${w.u ? `<span>美 <button data-speak="${esc(w.n)}" data-lang="en-US">${esc(w.u)}</button></span>` : ''}
          ${w.k ? `<span>英 <button data-speak="${esc(w.n)}" data-lang="en-GB">${esc(w.k)}</button></span>` : ''}
        </div>

        <div class="entry-grid">
          <section>
            <div class="section-h" style="margin-top:6px"><h2>释义</h2></div>
            <ol class="defs">${w.t.map((t, i) => `<li><i>${String(i + 1).padStart(2, '0')}</i><span>${esc(t)}</span></li>`).join('')}</ol>

            <div class="section-h" style="margin-top:26px"><h2>例句</h2><span>${EXAMPLES[w.n] ? '点击喇叭跟读' : ''}</span></div>
            ${EXAMPLES[w.n]
              ? `<div class="example">
                   <p class="en">${esc(EXAMPLES[w.n].en)} <button class="mini" data-speak="${esc(EXAMPLES[w.n].en)}" data-lang="en-US"><svg class="ico ico-sm"><use href="#i-volume"/></svg>朗读</button></p>
                   <p class="zh">${esc(EXAMPLES[w.n].zh)}</p>
                 </div>`
              : `<p class="muted">这个词暂时没有例句，先用上面的音标跟读；例句正在陆续补充。</p>`}

            ${rel.length ? `
            <div class="section-h"><h2>形近 / 同前缀</h2><span>按相似度排</span></div>
            <div class="rel">${rel.map(r => `<a href="#/w/${encodeURIComponent(r.n)}">${esc(r.n)}</a>`).join('')}</div>` : ''}
          </section>

          <aside>
            <div class="aside-card">
              <h3>词条信息</h3>
              <dl>
                <dt>首字母</dt><dd>${w.n[0].toUpperCase()}</dd>
                <dt>长度</dt><dd>${w.n.length}</dd>
                <dt>释义数</dt><dd>${w.t.length}</dd>
                <dt>序号</dt><dd>${idx + 1}</dd>
              </dl>
              <button class="btn ${inBook ? 'on' : ''}" data-book="${esc(w.n)}">${inBook ? '已在生词本' : '加入生词本'}</button>
              <button class="btn ${isKnown ? 'on' : ''}" data-known="${esc(w.n)}">${isKnown ? '已掌握' : '标记已掌握'}</button>
            </div>
          </aside>
        </div>

        <div class="pager">
          ${prev ? `<a href="#/w/${encodeURIComponent(prev.n)}"><svg class="ico ico-sm"><use href="#i-left"/></svg>${esc(prev.n)}</a>` : '<span>已经是第一个</span>'}
          <span>${idx + 1} / ${WORDS.length}</span>
          ${next ? `<a href="#/w/${encodeURIComponent(next.n)}">${esc(next.n)}<svg class="ico ico-sm"><use href="#i-right"/></svg></a>` : '<span>已经是最后一个</span>'}
        </div>
      </article>
    `;
  }

  function pageBook() {
    const list = [...book].map(n => INDEX.get(n)).filter(i => i !== undefined).map(i => WORDS[i]);
    return `
      <div class="crumb"><a href="#/">词库</a> / 生词本</div>
      <h1 style="margin:0 0 6px;font-size:30px">生词本</h1>
      <p style="color:var(--muted);margin:0">${list.length} 个词，存在本机浏览器里。</p>
      ${list.length ? `<div class="book-bar">
        <button class="btn" data-book-know>全部标记已掌握</button>
        <button class="btn" data-book-clear>清空生词本</button>
      </div>` : ''}
      ${list.length ? `<div class="wordlist">${list.map(w => `<a href="#/w/${encodeURIComponent(w.n)}"><span>${esc(w.n)}</span><em>${esc(w.t[0] || '')}</em></a>`).join('')}</div>`
        : '<div class="empty-box">还空着。去词条页点「加入生词本」，这里就会攒起来。</div>'}
    `;
  }

  /* ---------- 真题练习 ---------- */
  let exam = { i: 0, picked: null, right: 0, wrong: 0 };

  function examPool() {
    const all = window.CET_QUIZ || [];
    return level === 'all' ? all : all.filter(q => q.lv === level);
  }

  function pageExam() {
    const pool = examPool();
    const q = pool[exam.i];
    if (!pool.length) {
      return `<div class="crumb"><a href="#/">词库</a> / 真题</div>
        <div class="empty-box">当前词库还没有配套题目，切到「四级」或「六级」再试。</div>`;
    }
    if (!q) {
      return `<div class="crumb"><a href="#/">词库</a> / 真题</div>
        <div class="exam-done">
          <h1>这一组做完了</h1>
          <p>答对 ${exam.right} 题，答错 ${exam.wrong} 题。错题已进入错题本。</p>
          <button class="btn" style="width:auto" data-exam-reset>再来一组</button>
        </div>`;
    }
    const picked = exam.picked;
    return `
      <div class="crumb"><a href="#/">词库</a> / 真题</div>
      <div class="exam-head">
        <div class="exam-band"><span>模拟题</span><span>${q.lv === 'cet4' ? 'CET-4' : 'CET-6'} · ${q.type}</span></div>
        <h1>第 ${exam.i + 1} 题<span class="exam-total">/ ${pool.length}</span></h1>
      </div>
      <p class="exam-q">${esc(q.q)}</p>
      <div class="exam-opts">
        ${q.opts.map((o, i) => {
          let cls = '';
          if (picked !== null) {
            if (i === q.a) cls = 'right';
            else if (i === picked) cls = 'wrong';
          }
          return `<button class="exam-opt ${cls}" data-opt="${i}"><i>${'ABCD'[i]}</i><span>${esc(o)}</span></button>`;
        }).join('')}
      </div>
      ${picked !== null ? `<div class="exam-tip">
          <b>${picked === q.a ? '答对' : '答错'}</b>
          <p>${esc(q.tip)}</p>
          <button class="btn" style="width:auto" data-exam-next>${exam.i + 1 === pool.length ? '看结果' : '下一题'}</button>
        </div>` : ''}
      <p class="meta" style="margin-top:var(--s5)">答对 ${exam.right} · 答错 ${exam.wrong} · 标记为模拟题，题型对齐四六级</p>
    `;
  }

  /* ---------- 错题本 ---------- */
  function pageWrong() {
    const entries = Object.entries(wrongBook)
      .map(([n, c]) => ({ w: WORDS[INDEX.get(n)] || null, n, c }))
      .sort((a, b) => b.c - a.c);
    const rows = entries.filter(e => e.w);
    return `
      <div class="crumb"><a href="#/">词库</a> / 错题本</div>
      <h1 style="font-size:30px;margin-bottom:var(--s2)">错题本</h1>
      <p style="color:var(--muted);margin:0">${rows.length} 个词被答错过，按错误次数排序。</p>
      ${rows.length ? `<div class="book-bar">
        <button class="btn" data-wrong-practice>重练错题</button>
        <button class="btn" data-wrong-clear>清空错题</button>
      </div>` : ''}
      ${(() => {
        const ew = LS.get('cet4.examwrong', {});
        const qs = (window.CET_QUIZ || []).filter(q => ew[q.id]);
        return qs.length ? `<div class="section-h" style="margin-top:var(--s6)"><h2>题目错题</h2><span>${qs.length} 题</span></div>
          <div class="wrong-q">${qs.map(q => `<div><b>${esc(q.q)}</b><p>正确答案：${'ABCD'[q.a]} · ${esc(q.opts[q.a])}<br>${esc(q.tip)}</p></div>`).join('')}</div>` : '';
      })()}
      ${rows.length
        ? `<div class="wordlist">${rows.map(e => `
            <a href="#/w/${encodeURIComponent(e.w.n)}">
              <span>${esc(e.w.n)}</span><em>${esc(e.w.t[0] || '')} · 错 ${e.c} 次</em>
            </a>`).join('')}</div>`
        : '<div class="empty-box">还没有错题。去「学习模式」做几道题，答错的词会自动出现在这里。</div>'}
    `;
  }

  /* ---------- 学习模式 ---------- */
  let study = { mode: 'flash', queue: [], i: 0, flipped: false, right: 0, wrong: 0, answered: false };

  function buildQueue() {
    const pool = book.size ? [...book].map(n => INDEX.get(n)).filter(i => i !== undefined).map(i => WORDS[i]) : WORDS;
    study.queue = pool.slice().sort(() => Math.random() - 0.5).slice(0, 20);
    study.i = 0; study.right = 0; study.wrong = 0; study.flipped = false; study.answered = false;
  }

  function pageStudy() {
    if (!study.queue.length) buildQueue();
    const w = study.queue[study.i];
    if (!w) {
      return `<div class="crumb"><a href="#/">词库</a> / 学习模式</div>
        <div class="empty-box"><p>这一轮结束了：答对 ${study.right}，答错 ${study.wrong}。</p>
        <button class="btn" style="width:auto;display:inline-block" data-restart>再来一轮</button></div>`;
    }
    const modeSwitch = `<div class="mode-switch">
        <button type="button" data-study-mode="flash" class="${study.mode === 'flash' ? 'on' : ''}">闪卡</button>
        <button type="button" data-study-mode="quiz" class="${study.mode === 'quiz' ? 'on' : ''}">看词选义</button>
      </div>`;
    if (study.mode === 'flash') {
      return `
        <div class="crumb"><a href="#/">词库</a> / 学习模式</div>
        ${modeSwitch}
        <div class="study-meta"><span>${book.size ? '生词本' : '全部词库'}</span><span>${study.i + 1} / ${study.queue.length}</span><span>已掌握 ${known.size}</span></div>
        <div class="card-area">
          <div class="flashcard" data-flip>
            ${study.flipped
              ? `<div class="back">${w.t.map(esc).join('<br>')}</div>`
              : `<div><div class="front">${esc(w.n)}</div>${w.u ? `<div style="color:var(--muted);font-family:ui-monospace,monospace">${esc(w.u)}</div>` : ''}</div>`}
            <div class="hint">点卡片翻面 · 空格键也行</div>
          </div>
        </div>
        <div class="study-actions">
          <button class="btn" data-skip>不认识，下一个</button>
          <button class="btn on" data-know>认识，记下来</button>
        </div>`;
    }
    const options = [w, ...[0, 1, 2].map(() => WORDS[Math.floor(Math.random() * WORDS.length)]).filter(x => x.lower !== w.lower)];
    const shuffled = options.slice().sort(() => Math.random() - 0.5);
    return `
      <div class="crumb"><a href="#/">词库</a> / 学习模式</div>
      ${modeSwitch}
      <div class="study-meta"><span>看词选义</span><span>${study.i + 1} / ${study.queue.length}</span><span>对 ${study.right} · 错 ${study.wrong}</span></div>
      <div style="margin:26px 0 8px;font-size:36px;font-family:ui-monospace,monospace">${esc(w.n)}</div>
      <div style="color:var(--muted);font-family:ui-monospace,monospace;margin-bottom:18px">${esc(w.u)}</div>
      ${shuffled.map((o, i) => `<button class="quiz-option" data-answer="${esc(o.n)}">${esc(o.t.join('；'))}</button>`).join('')}
      <div style="margin-top:14px;font-size:13px;color:var(--muted)">选错了会直接告诉你正确答案</div>`;
  }

  /* ---------- 关于 ---------- */
  function pageAbout() {
    return `
      <div class="crumb"><a href="#/">词库</a> / 关于</div>
      <h1 style="margin:0 0 14px;font-size:30px">关于这个页面</h1>
      <p>这是一个纯静态的四六级词汇百科：没有后端、没有账号、不联网也能用。所有数据都在 <code>data.js</code> / <code>data6.js</code> 里，学习记录（生词本、已掌握）存在浏览器 localStorage。</p>
      <div class="section-h"><h2>快捷键</h2></div>
      <ul style="line-height:2">
        <li><code>/</code> 聚焦搜索框</li>
        <li><code>↑</code> <code>↓</code> 在搜索结果间移动，<code>Enter</code> 打开</li>
        <li><code>Esc</code> 关闭搜索面板</li>
        <li>词卡页 <code>空格</code> 翻面</li>
      </ul>
      <div class="section-h"><h2>阅读设置</h2></div>
      <button class="btn" style="width:auto;display:inline-flex;margin-top:var(--s3)" id="replay-intro">重播片头</button>
      <label class="check"><input type="checkbox" id="autoread" ${LS.get('cet4.autoread', true) ? 'checked' : ''}> 进入词条时自动朗读单词</label>

      <div class="section-h"><h2>数据</h2></div>
      <p>词条 ${WORDS.length} 条，含美/英音标与中文释义；形近词按编辑距离与共同前缀推导，不引入外部接口。</p>
      <p>其中 ${Object.keys(EXAMPLES).length} 个高频词配有中英对照例句，例句由 AI（DeepSeek Harness）生成并经人工挑选，仅作学习参考，不引用任何受版权保护的词典原文。朗读使用浏览器内置语音合成（Web Speech API），离线可用。</p>
    `;
  }

  /* ---------- 路由 ---------- */
  function route() {
    const hash = location.hash.replace(/^#/, '') || '/';
    const parts = hash.split('/').filter(Boolean);
    if (parts[0] === 'w') { setActiveNav(''); app.innerHTML = pageWord(decodeURIComponent(parts.slice(1).join('/'))); }
    else if (parts[0] === 'l') { setActiveNav(''); app.innerHTML = pageLetter(parts[1]); }
    else if (parts[0] === 'book') { setActiveNav('book'); app.innerHTML = pageBook(); }
    else if (parts[0] === 'wrong') { setActiveNav('wrong'); app.innerHTML = pageWrong(); }
    else if (parts[0] === 'exam') { setActiveNav('exam'); app.innerHTML = pageExam(); }
    else if (parts[0] === 'study') { setActiveNav('study'); app.innerHTML = pageStudy(); }
    else if (parts[0] === 'search') { setActiveNav(''); app.innerHTML = pageSearch(decodeURIComponent(parts.slice(1).join('/'))); }
    else if (parts[0] === 'about') { setActiveNav('about'); app.innerHTML = pageAbout(); }
    else { setActiveNav('home'); app.innerHTML = pageHome(); }
    renderSidebar();
    app.style.animation = 'none';
    void app.offsetHeight;
    app.style.animation = '';
    window.scrollTo({ top: 0, behavior: 'instant' });

    // 进入词条页自动朗读单词（可在「关于」里关掉）
    if (parts[0] === 'w' && LS.get('cet4.autoread', true)) {
      const word = decodeURIComponent(parts.slice(1).join('/'));
      setTimeout(() => speakWord(word), 160);
    }
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-book],[data-known],[data-book-know],[data-book-clear],[data-wrong-clear],[data-wrong-practice],[data-study-mode],[data-opt],[data-exam-next],[data-exam-reset],[data-speak],[data-flip],[data-know],[data-skip],[data-answer],[data-restart]');
    if (!t) return;

    if (t.dataset.speak) {
      speakWord(t.dataset.speak, t.dataset.lang || 'en-US');
      return;
    }
    if (t.hasAttribute('data-book-clear')) {
      if (!book.size) return;
      if (window.confirm('清空生词本里的 ' + book.size + ' 个词？')) {
        book.clear();
        LS.set('cet4.book', []);
        route();
      }
      return;
    }
    if (t.hasAttribute('data-opt')) {
      const pool = examPool();
      const q = pool[exam.i];
      if (!q || exam.picked !== null) return;
      const idx = Number(t.dataset.opt);
      exam.picked = idx;
      if (idx === q.a) exam.right++; else {
        exam.wrong++;
        const ew = LS.get('cet4.examwrong', {});
        ew[q.id] = (ew[q.id] || 0) + 1;
        LS.set('cet4.examwrong', ew);
      }
      route();
      return;
    }
    if (t.hasAttribute('data-exam-next')) {
      exam.i++; exam.picked = null; route(); return;
    }
    if (t.hasAttribute('data-exam-reset')) {
      exam = { i: 0, picked: null, right: 0, wrong: 0 }; route(); return;
    }
    if (t.hasAttribute('data-study-mode')) {
      study.mode = t.dataset.studyMode;
      study.i = 0; study.flipped = false;
      route();
      return;
    }
    if (t.hasAttribute('data-wrong-clear')) {
      const n = Object.keys(wrongBook).length;
      if (!n) return;
      if (window.confirm('清空 ' + n + ' 个错题记录？')) {
        wrongBook = {};
        LS.set('cet4.wrong', {});
        route();
      }
      return;
    }
    if (t.hasAttribute('data-wrong-practice')) {
      const pool = Object.keys(wrongBook).map(n => WORDS[INDEX.get(n)]).filter(Boolean);
      if (!pool.length) return;
      study.queue = pool.slice().sort(() => Math.random() - 0.5).slice(0, 20);
      study.i = 0; study.right = 0; study.wrong = 0; study.flipped = false; study.answered = false;
      study.mode = 'quiz';
      location.hash = '#/study';
      route();
      return;
    }
    if (t.hasAttribute('data-book-know')) {
      for (const n of book) known.add(n);
      LS.set('cet4.known', [...known]);
      route();
      return;
    }
    if (t.dataset.book) {
      const key = t.dataset.book.toLowerCase();
      book.has(key) ? book.delete(key) : book.add(key);
      LS.set('cet4.book', [...book]);
      route();
      return;
    }
    if (t.dataset.known) {
      const key = t.dataset.known.toLowerCase();
      known.has(key) ? known.delete(key) : known.add(key);
      LS.set('cet4.known', [...known]);
      route();
      return;
    }
    if (t.hasAttribute('data-flip')) { study.flipped = !study.flipped; route(); return; }
    if (t.hasAttribute('data-know')) {
      known.add(study.queue[study.i].lower);
      LS.set('cet4.known', [...known]);
      study.i++; study.flipped = false; route(); return;
    }
    if (t.hasAttribute('data-skip')) { study.i++; study.flipped = false; route(); return; }
    if (t.hasAttribute('data-restart')) { study.queue = []; route(); return; }
    if (t.dataset.answer) {
      const w = study.queue[study.i];
      const ok = t.dataset.answer === w.n;
      t.classList.add(ok ? 'right' : 'wrong');
      if (!ok) {
        const el = [...document.querySelectorAll('.quiz-option')].find(o => o.dataset.answer === w.n);
        if (el) el.classList.add('right');
      }
      ok ? study.right++ : study.wrong++;
      if (!ok) {
        wrongBook[w.n] = (wrongBook[w.n] || 0) + 1;
        LS.set('cet4.wrong', wrongBook);
        if (ok) {} 
      } else if (wrongBook[w.n]) {
        delete wrongBook[w.n];
        LS.set('cet4.wrong', wrongBook);
      }
      if (ok) known.add(w.lower);
      LS.set('cet4.known', [...known]);
      setTimeout(() => { study.i++; route(); }, ok ? 420 : 1100);
    }
  });

  document.addEventListener('keydown', (e) => {
    // 词条页 ← / → 切换上一个 / 下一个
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') &&
        location.hash.startsWith('#/w/') && document.activeElement.tagName !== 'INPUT') {
      const name = decodeURIComponent(location.hash.slice(4));
      const idx = INDEX.get(name.toLowerCase());
      if (idx !== undefined) {
        const target = WORDS[e.key === 'ArrowLeft' ? idx - 1 : idx + 1];
        if (target) {
          e.preventDefault();
          location.hash = '#/w/' + encodeURIComponent(target.n);
        }
      }
      return;
    }
    if (e.key === ' ' && location.hash.startsWith('#/study') && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      study.flipped = !study.flipped;
      route();
    }
  });

  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'replay-intro') {
      sessionStorage.removeItem('cet4.intro');
      location.reload();
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'autoread') {
      LS.set('cet4.autoread', e.target.checked);
    }
  });


  /* ---------- 片头（2.1 秒） ---------- */
  (function intro() {
    const el = document.getElementById('intro');
    if (!el) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || sessionStorage.getItem('cet4.intro') === '1') { el.remove(); return; }
    sessionStorage.setItem('cet4.intro', '1');
    document.documentElement.style.overflow = 'hidden';
    let closed = false;
    const close = () => {
      if (closed || !document.body.contains(el)) return;
      closed = true;
      el.classList.add('out');
      document.documentElement.style.overflow = '';
      setTimeout(() => el.remove(), 460);
    };
    setTimeout(close, 2100);
    const skip = document.getElementById('intro-skip');
    if (skip) skip.addEventListener('click', close);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); }, { once: true });
  })();

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
